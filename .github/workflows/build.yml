name: Build Inklet installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- macOS
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            arch: arm64
          - runner: macos-13   # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip uninstall -y jax jaxlib scipy || true
          brew install create-dmg || true
      - run: |
          chmod +x build_mac.sh
          ./build_mac.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: inklet-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.pkg

  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip uninstall -y jax jaxlib scipy || true
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - run: .\build_windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: inklet-windows-x64
          path: |
            dist/*setup.exe
            dist/*portable.zip

  # ---------------------------------------------------------------- Linux
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libs (Qt/OpenGL/xcb) + AppImage tool
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 \
            libxkbcommon0 libdbus-1-3 fuse libfuse2
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip uninstall -y jax jaxlib scipy || true
      - run: |
          chmod +x build_linux.sh
          ./build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: inklet-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.tar.gz
